services:
  redis:
    image: redis:7-alpine
    # Keyspace Notifications 활성화 — session-expiration.listener 가 의존
    # Ex = 키 만료 이벤트 (E + expired)
    command: >
      redis-server
      --notify-keyspace-events Ex
      --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-blackout}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-telemetry}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-blackout} -d ${POSTGRES_DB:-telemetry}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVER_API_KEY=${SERVER_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - PORT=3000
      # 세션 정원. 미설정 시 4. 테스트 시 .env 에 SESSION_MAX_PLAYERS=2 주입.
      - SESSION_MAX_PLAYERS=${SESSION_MAX_PLAYERS:-4}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-blackout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telemetry}?schema=public
    ports:
      - '3000:3000'
      - '3001:3001'
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
